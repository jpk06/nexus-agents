[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agents"
version = "0.6.0"
description = "A small, explicit and fully testable runtime for LLM agents and multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jiang Longhuan", email = "2513459544@qq.com" }]
keywords = [
    "llm",
    "agent",
    "react",
    "tools",
    "function-calling",
    "multi-agent",
    "fastapi",
    "sse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 可选依赖分层：核心运行时只依赖 pydantic + httpx，想用 HTTP 层才装 fastapi。
api = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # 测试要覆盖 HTTP 层，所以 dev 里必须有它 —— CI 只装 .[dev]
    "fastapi>=0.110",
]

# 容器和 systemd 都能直接调用它；``python -m nexus_agents.service`` 等价
[project.scripts]
nexus-service = "nexus_agents.service.__main__:main"

[project.urls]
Homepage = "https://github.com/jpk06/nexus-agents"
Repository = "https://github.com/jpk06/nexus-agents"
Issues = "https://github.com/jpk06/nexus-agents/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",     # FastAPI 风格的默认参数依赖注入
    "SIM108",   # 有时候三元表达式不如 if/else 好读
    "RUF002",   # 文档字符串里正常使用中文标点
    "RUF003",   # 注释里正常使用中文标点
    "RUF022",   # __all__ 按语义分组而不是字母序
    "UP042",    # 保留 str+Enum：序列化行为比 StrEnum 更可预测
]

[tool.ruff.lint.per-file-ignores]
# 测试里刻意使用 typing.List / Optional 等旧写法，用来验证向后兼容
"tests/*" = ["UP006", "UP007", "UP035", "UP045"]
# 示例里刻意使用中文原文与全角标点（检索演示要真实的中文语料）
"examples/*" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
