name: CI

# 为什么 push 和 pull_request 都要跑：
# push 保证合并进主干后是绿的；pull_request 保证评审时就能看到结果，
# 而不是等合并之后才发现红灯。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一个分支上连续推送时，取消还在排队的旧运行 —— 只保留最新一次结果，
# 省分钟数也让反馈更快。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查只在一个版本上跑：ruff 和 mypy 的结果跟 Python 版本关系不大，
  # 放到矩阵里跑三遍纯粹是浪费分钟数。
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests examples benchmarks

      - name: mypy
        run: mypy src/nexus_agents

  # 测试跑矩阵：包声明支持 3.11+，那就真的在这几个版本上验一遍，
  # 否则 classifiers 里的版本号只是装饰。
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: pytest --cov=nexus_agents --cov-report=term-missing

      # 示例必须离线可跑：CI 里没有 API Key，跑不起来就说明示例违反了项目约定。
      - name: examples run offline
        run: |
          python examples/quickstart.py
          python examples/graph_demo.py
          python examples/multiagent.py
          python examples/memory_demo.py
          python examples/async_demo.py
          python examples/stream_demo.py
          python examples/service_demo.py

      # 基准也离线跑：跑的不是绝对数字（共享 runner 上没意义），而是
      # 确认脚本没有悄悄坏掉 —— 护栏断言会拦住「数字变漂亮但全是假的」
      - name: benchmarks run offline
        run: python benchmarks/benchmark.py

  # 镜像单独一个 job：它要 Docker daemon，而 lint/test 不需要。
  # 放在同一个 workflow 里，PR 上就能回答「这个 Dockerfile 现在还构建得起来吗」，
  # 而不是等部署那天才发现某一层早就坏了。
  docker:
    name: docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag nexus-agents:ci .

      # compose 文件是给人手敲的，最容易在改名改端口时腐烂；
      # config 只解析不启动，几十毫秒就能拦住语法/插值错误
      - name: Compose file is valid
        run: docker compose config > /dev/null

      - name: Image stays small
        run: |
          size=$(docker image inspect nexus-agents:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MiB"
          # 卡上限而不是下限：多阶段构建一旦漏拷 .venv 或构建工具链，
          # 体积会翻几倍，而功能测试全绿 —— 只有这条能发现
          test "$size" -lt 600000000

      - name: Config resolves inside the image, with the key masked
        run: |
          out=$(docker run --rm -e NEXUS_API_KEY=sk-should-not-appear nexus-agents:ci \
            python -m nexus_agents.service --check)
          echo "$out"
          # 密钥进日志等于泄露：这条断言直接盯住输出
          if echo "$out" | grep -q "sk-should-not-appear"; then
            echo "::error::the API key leaked into --check output"
            exit 1
          fi

      - name: Container starts, serves and becomes healthy
        run: |
          docker run -d --name smoke -p 8123:8000 \
            -e NEXUS_BASE_URL=http://127.0.0.1:9/v1 \
            -e NEXUS_API_KEY=ci-dummy \
            -e NEXUS_SERVICE_KEY=ci-gate \
            nexus-agents:ci
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$code" = "200" || { docker logs smoke; exit 1; }
          curl -s http://127.0.0.1:8123/healthz

      - name: Metrics endpoint serves Prometheus text format
        run: |
          body=$(curl -s http://127.0.0.1:8123/metrics)
          echo "$body" | grep '^nexus_' | head -3
          echo "$body" | grep -q '^# TYPE nexus_http_requests_total counter$'
          echo "$body" | grep -q '^nexus_http_requests_in_flight 0$'

      - name: Shared-secret gate rejects a request without the header
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8123/sessions \
            -H 'content-type: application/json' -d '{}')
          echo "status without X-API-Key: $code"
          test "$code" = "401"

      - name: Container runs as a non-root user
        run: test "$(docker exec smoke id -u)" != "0"

      - name: Logs when something failed
        if: failure()
        run: docker logs smoke || true

      - name: Stop the container
        if: always()
        run: docker rm -f smoke || true
